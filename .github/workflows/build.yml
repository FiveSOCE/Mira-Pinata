name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MiraPinata-0.1.5
          path: build/libs/MiraPinata-0.1.5.jar

      - name: Publish v0.1.5 release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.5 >/dev/null 2>&1; then
            gh release create v0.1.5 \
              build/libs/MiraPinata-0.1.5.jar \
              --target "${{ github.sha }}" \
              --title "MiraPinata v0.1.5" \
              --notes "Moves Pinata spawn, hit, low-health and defeat presentation into MiraCosmetics, removing the old hard-coded hit particle/sound presentation."
          fi
