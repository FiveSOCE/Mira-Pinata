name: MiraPinata standalone modern 1.21.11-26.2
on:
  push:
    branches: ['compat/modern-1.21.11-26.2']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compatibility-1-21-11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - run: gradle clean compileJava -PpaperApiVersion=1.21.11-R0.1-SNAPSHOT -PcompileJavaVersion=21 -PbytecodeJavaVersion=21 --stacktrace
  compatibility-26-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - run: gradle clean compileJava -PpaperApiVersion=26.2.build.121-stable -PcompileJavaVersion=25 -PbytecodeJavaVersion=25 --stacktrace
  build:
    needs: [compatibility-1-21-11, compatibility-26-2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Compile and test distributable
        run: gradle clean test build --no-daemon --stacktrace
      - name: Verify JAR and standalone status
        shell: bash
        run: |
          set -euo pipefail
          JAR=build/libs/MiraPinata_1.21.11-26.2.jar
          test -s "$JAR"
          jar tf "$JAR" | grep -Fx plugin.yml
          jar tf "$JAR" | grep -Fx com/mira/pinata/MiraPinataPlugin.class
          javap -verbose -classpath "$JAR" com.mira.pinata.MiraPinataPlugin | grep -F 'major version: 65'
          unzip -p "$JAR" plugin.yml | grep -F "api-version: '1.21'"
          ! unzip -p "$JAR" plugin.yml | grep -E '^depend:'
      - uses: actions/upload-artifact@v4
        with:
          name: MiraPinata_1.21.11-26.2
          path: build/libs/MiraPinata_1.21.11-26.2.jar
          if-no-files-found: error
      - name: Publish standalone modern prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view compat-modern-1.21.11-26.2 >/dev/null 2>&1 || gh release create compat-modern-1.21.11-26.2 --prerelease --title 'MiraPinata standalone modern 1.21.11-26.2' --notes 'Independent MiraPinata. Build checks Paper 1.21.11 and 26.2. In-game validation and intermediate versions pending.' --target "$GITHUB_SHA"
          gh release upload compat-modern-1.21.11-26.2 build/libs/MiraPinata_1.21.11-26.2.jar --clobber
