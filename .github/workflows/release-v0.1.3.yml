name: Release v0.1.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 923ee64937870313664493be9b775109e21157aa
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.3 \
            build/libs/MiraPinata-0.1.3.jar \
            --target 923ee64937870313664493be9b775109e21157aa \
            --title "MiraPinata v0.1.3" \
            --notes "Adds real attack-speed-gated melee hits with normal Zombie knockback/hurt feedback, GUI-editable melee charge threshold, and independent per-reward percentage drop chances including decimal ultra-rare chances."
