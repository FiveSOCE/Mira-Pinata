name: MiraPinata
version: 0.1.4
main: com.mira.pinata.MiraPinataPlugin
api-version: '1.21'
authors: [FiveS]
description: GUI-driven fighting pinata boss event with named variants and leaderboard data.
depend: [MiraCore]
softdepend: [PlaceholderAPI, MiraNPC]
commands:
  mpinata:
    description: Open the MiraPinata administrator GUI.
    usage: /mpinata
    permission: mirapinata.admin
permissions:
  mirapinata.admin:
    default: op
